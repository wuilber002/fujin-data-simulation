services:
  fujin-provider:
    build: .
    restart: unless-stopped
    environment:
      FUJIN_PROVIDER_DATABASE_URL: sqlite+pysqlite:////var/lib/fujin/catalog.db
      FUJIN_PROVIDER_PAYLOAD_ROOT: /var/lib/fujin/payloads
      FUJIN_PROVIDER_STAGING_ROOT: /var/lib/fujin/staging
    ports:
      - "${FUJIN_BIND_HOST:-127.0.0.1}:${FUJIN_BIND_PORT:-8090}:8080"
    volumes:
      - fujin-data:/var/lib/fujin
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz').read()"]
      interval: 10s
      timeout: 3s
      retries: 12

  fujin-materializer:
    build: .
    restart: unless-stopped
    command: ["python3", "-m", "app.provider_materializer"]
    environment:
      FUJIN_PROVIDER_DATABASE_URL: sqlite+pysqlite:////var/lib/fujin/catalog.db
      FUJIN_PROVIDER_PAYLOAD_ROOT: /var/lib/fujin/payloads
      FUJIN_PROVIDER_STAGING_ROOT: /var/lib/fujin/staging
    volumes:
      - fujin-data:/var/lib/fujin
    depends_on:
      fujin-provider:
        condition: service_healthy

  fujin-simulator:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "python3 scripts/migrate-fujin-simulator.py && exec uvicorn app.simulator:app --host 0.0.0.0 --port 8091"]
    environment:
      FUJIN_SIMULATOR_DATABASE_URL: sqlite+pysqlite:////var/lib/fujin/simulator.db
    ports:
      - "${FUJIN_SIMULATOR_BIND_HOST:-127.0.0.1}:${FUJIN_SIMULATOR_BIND_PORT:-8091}:8091"
    volumes:
      - fujin-data:/var/lib/fujin
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/readyz').read()"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  fujin-data:
